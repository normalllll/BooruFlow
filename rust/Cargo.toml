[package]
name = "booruflow_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "booruflow_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
web-challenge-window = ["dep:wry", "dep:tao", "dep:muda", "dep:windows", "dep:webview2-com"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
async-trait = "0.1.92"
avif-rust = "0.0.8"
base64 = "0.23.1"
lodepng = "3.12.2"
image-webp = "0.2.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zune-jpeg = "0.5.15"
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
url = "2.5.8"
tempfile = "3.27.0"
getrandom = "0.4.3"

tokio = { version = "1.53.2", features = ["test-util", "full"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
md-5 = "0.11.0"
sha2 = "0.11.0"

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["rustls-no-provider", "json", "stream", "http2", "socks", "system-proxy"]

[dependencies.rustls]
version = "0.23.45"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.9"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.57.0", optional = true }
tao = { version = "=0.37.1", optional = true }
muda = { version = "=0.21.2", optional = true }
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
webview2-com = { version = "=0.39.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
webpki-root-certs = "1.0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
