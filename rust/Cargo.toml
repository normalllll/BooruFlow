[package]
name = "core"
version = "0.1.0"
edition = "2021"

[lib]
name = "core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
web-challenge-window = ["dep:wry", "dep:tao", "dep:muda", "dep:windows", "dep:webview2-com"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
async-trait = "0.1"
avif-rust = "0.0.7"
base64 = "0.22"
lodepng = "3.12.1"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"
tempfile = "3"
getrandom = "0.4"

tokio = { version = "1", features = ["test-util", "full"] }
tokio-util = "0.7"
futures-util = "0.3"
md-5 = "0.10.6"
sha2 = "0.10.9"

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["rustls-no-provider", "json", "stream", "http2", "socks", "system-proxy"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.serde]
version = "1"
features = ["derive"]

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.57.0", optional = true }
tao = { version = "=0.37.0", optional = true }
muda = { version = "=0.19.3", optional = true }
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
webview2-com = { version = "=0.39.1", optional = true }

[dev-dependencies]
tempfile = "3"
webpki-root-certs = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
