[package]
name = "core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
rustc_version = "0.4"


[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
anyhow = "1"
lazy_static = "*"
url = "2.5"

tokio = { version = "1", features = ["test-util", "full"] }
tokio-util = "0.7"
futures-util = "0.3"

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["rustls", "json", "stream", "http2"]

#[dependencies.serde_json]
#version = "1.0.140"

[dependencies.serde]
version = "1"
features = ["derive"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
