name: Set up Flutter and Rust
description: Install pinned SDKs and cache dependencies and native compilation.
inputs:
  platform:
    description: Build platform (separates SDK and compiler caches)
    required: true
  rust-targets:
    description: Additional Rust targets required by the build
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Read Rust version
      id: rust-version
      shell: bash
      run: |
        version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust/rust-toolchain.toml)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        target: ${{ inputs.rust-targets }}
        rust-src-dir: rust
        components: rustfmt
        cache: false
        rustflags: ''

    # Native Assets supplies its own --target-dir (including temporary paths on
    # Windows), so caching rust/target would not cache Flutter's Rust builds.
    - name: Cache Cargo downloads
      id: cargo-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform }}-

    - name: Set up compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.16.0

    - name: Enable compiler cache
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_VERSION=booruflow-v1-${{ inputs.platform }}" >> "$GITHUB_ENV"

    - name: Connect Native Assets to compiler cache
      shell: bash
      run: |
        # Hooks filter RUSTC_WRAPPER and the GHA credentials out of their env.
        # Start the daemon here with credentials; Cargo hooks use its local socket.
        # Keep credentials out of hook inputs and verbose Cargo environment logs.
        SCCACHE_IDLE_TIMEOUT=0 sccache --start-server
        mkdir -p .cargo
        if [ -f .cargo/config.toml ] || [ -f .cargo/config ]; then
          echo "A Cargo config already exists; merge the CI wrapper settings explicitly."
          exit 1
        fi
        printf '[build]\nrustc-wrapper = "sccache"\nincremental = false\n' > .cargo/config.toml

    - name: Set up Flutter
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.47.2'
        cache: true
        pub-cache: true
        cache-key: flutter-v1-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ inputs.platform }}
        # flutter-action appends the pubspec.lock hash automatically.
        pub-cache-key: pub-v1-${{ runner.os }}-${{ runner.arch }}-3.47.2

    - name: Restore Flutter dependencies
      shell: bash
      # Allow Flutter's SDK-pinned dependencies to resolve when upgrading SDKs.
      run: flutter pub get

    - name: Summarize dependency caches
      shell: bash
      env:
        FLUTTER_HIT: ${{ steps.flutter.outputs.CACHE-HIT }}
        PUB_HIT: ${{ steps.flutter.outputs.PUB-CACHE-HIT }}
        CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
      run: |
        {
          echo "### ${{ inputs.platform }} caches"
          echo "| Cache | Exact hit |"
          echo "| --- | --- |"
          echo "| Flutter SDK | ${FLUTTER_HIT:-false} |"
          echo "| Pub packages | ${PUB_HIT:-false} |"
          echo "| Cargo downloads | ${CARGO_HIT:-false} |"
          echo ""
          echo "Rust: ${{ steps.rust-version.outputs.version }}. Compiler statistics appear in the sccache post step."
          echo "Tag caches are isolated; run this workflow on the default branch to warm reusable caches."
        } >> "$GITHUB_STEP_SUMMARY"
