name: Flutter Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  RUST_VERSION: '1.96.0'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/my-release-key.jks

      - name: Build APK
        run: |
          flutter build apk --release \
            --android-project-arg=KEYSTORE_FILE=my-release-key.jks \
            --android-project-arg=KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            --android-project-arg=KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            --android-project-arg=KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
            build/app/outputs/apk/release/app-universal-release.apk
            build/app/outputs/apk/release/app-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-windows-x64:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows
      - name: Package Windows Build
        run: |
          cd build\windows\x64\runner\Release && 7z a -tzip windows-x64.zip .\*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/windows/x64/runner/Release/windows-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-linux-x64:
    name: Build & Release Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux

      - name: Package Linux Tarball
        run: |
          cd build/linux/x64/release/bundle && tar -czvf linux-x64.tar.gz *


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/linux/x64/release/bundle/linux-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-ios:
    name: Build & Release iOS
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv ./Runner.app ./Payload
          zip -r -m ./ios-nosigned.ipa ./Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/ios/iphoneos/ios-nosigned.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-macos:
    name: Build & Release macOS arm64 & x86_64
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build macOS arm64
        run: |
          export FLUTTER_BUILD_ARCH=arm64
          flutter build macos
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/yande_gui.app macos-arm64-nosigned.zip
      - name: Build macOS x86_64
        run: |
          export FLUTTER_BUILD_ARCH=x86_64
          flutter build macos
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/yande_gui.app macos-x86_64-nosigned.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            macos-arm64-nosigned.zip
            macos-x86_64-nosigned.zip
          token: ${{ secrets.GITHUB_TOKEN }}
