name: Flutter Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release (must select a version tag)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:

  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate version and publication target
        id: version
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Expected pubspec version in major.minor.patch+build format"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || {
              echo "Tag must match pubspec version: v$VERSION"
              exit 1
            }
          elif [[ "$PUBLISH_RELEASE" == true ]]; then
            echo "To publish, select a version tag instead of a branch"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-and-release-android:
    name: Build APK
    runs-on: ubuntu-24.04
    needs: validate
    environment: apk-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: android
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Restore Keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE_BASE64" ]; then
            echo "KEYSTORE_FILE secret is empty or not available"
            exit 1
          fi

          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/booruflow-key.jks

          if [ ! -s android/app/booruflow-key.jks ]; then
            echo "Restored keystore is empty"
            exit 1
          fi

          ls -lh android/app/booruflow-key.jks

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/booruflow-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --android-project-arg=KEYSTORE_FILE=booruflow-key.jks \
            --android-project-arg=KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            --android-project-arg=KEY_ALIAS="$KEY_ALIAS" \
            --android-project-arg=KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload android artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-android
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
            build/app/outputs/apk/release/app-universal-release.apk
            build/app/outputs/apk/release/app-x86_64-release.apk

  build-and-release-windows-x64:
    name: Build Windows x64
    runs-on: windows-2025
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: windows
          rust-targets: x86_64-pc-windows-msvc

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Build
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip windows-x64.zip .\*

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/windows/x64/runner/Release/windows-x64.zip

  build-and-release-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    needs: validate

    env:
      APP_NAME: booruflow
      APP_BINARY: booruflow
      APP_DISPLAY_NAME: BooruFlow
      APP_URL: https://github.com/${{ github.repository }}
      APP_LICENSE: GPL-3.0-only
      APP_ARCH: amd64
      RPM_ARCH: x86_64
      BUNDLE_DIR: build/linux/x64/release/bundle
      PACKAGE_ROOT: build/package-root
      DEB_DIR: build/deb/booruflow

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            dpkg-dev \
            rpm \
            ruby \
            ruby-dev \
            build-essential

          sudo gem install --no-document fpm --version 1.17.0

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: linux
          rust-targets: x86_64-unknown-linux-gnu

      - name: Build Linux
        run: flutter build linux --release

      - name: Prepare Linux Package Root
        run: |
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Bundle directory not found: $BUNDLE_DIR"
            find build/linux -maxdepth 5 -type d || true
            exit 1
          fi

          if [ ! -f "icon-512.png" ]; then
            echo "icon-512.png not found in project root"
            exit 1
          fi

          rm -rf "$PACKAGE_ROOT" "$DEB_DIR"

          mkdir -p "$PACKAGE_ROOT/usr/lib/$APP_NAME"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/applications"
          mkdir -p "$PACKAGE_ROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$PACKAGE_ROOT/usr/share/metainfo"

          cp -r "$BUNDLE_DIR/"* "$PACKAGE_ROOT/usr/lib/$APP_NAME/"

          cat > "$PACKAGE_ROOT/usr/bin/$APP_NAME" << EOF
          #!/usr/bin/env bash
          cd /usr/lib/$APP_NAME
          exec ./$APP_BINARY "\$@"
          EOF
          chmod +x "$PACKAGE_ROOT/usr/bin/$APP_NAME"

          cp -r linux/icons/hicolor/. "$PACKAGE_ROOT/usr/share/icons/hicolor/"

          cat > "$PACKAGE_ROOT/usr/share/applications/$APP_NAME.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=$APP_DISPLAY_NAME
          Comment=$APP_DISPLAY_NAME
          Exec=$APP_NAME
          Icon=$APP_NAME
          Terminal=false
          Categories=Utility;
          StartupNotify=true
          EOF

          cat > "$PACKAGE_ROOT/usr/share/metainfo/$APP_NAME.metainfo.xml" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$APP_NAME</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>$APP_LICENSE</project_license>
            <name>$APP_DISPLAY_NAME</name>
            <summary>$APP_DISPLAY_NAME desktop application</summary>
            <description>
              <p>$APP_DISPLAY_NAME desktop application built with Flutter.</p>
            </description>
            <launchable type="desktop-id">$APP_NAME.desktop</launchable>
            <url type="homepage">$APP_URL</url>
            <provides>
              <binary>$APP_NAME</binary>
            </provides>
          </component>
          EOF

      - name: Package Linux Tarball
        run: |
          tar -C "$BUNDLE_DIR" -czvf "build/linux-x64.tar.gz" .

      - name: Package Linux Deb
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          mkdir -p "$DEB_DIR/DEBIAN"
          cp -r "$PACKAGE_ROOT/"* "$DEB_DIR/"

          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: $APP_NAME
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $APP_ARCH
          Maintainer: normalllll
          Homepage: $APP_URL
          Depends: libgtk-3-0, libstdc++6
          Description: $APP_DISPLAY_NAME desktop application
           $APP_DISPLAY_NAME desktop application built with Flutter.
          EOF

          dpkg-deb --build --root-owner-group "$DEB_DIR" "build/linux_amd64.deb"

      - name: Package Linux RPM
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          fpm \
            -s dir \
            -t rpm \
            -n "$APP_NAME" \
            -v "${VERSION%%+*}" \
            --iteration "${VERSION##*+}" \
            --architecture "$RPM_ARCH" \
            --description "$APP_DISPLAY_NAME desktop application built with Flutter." \
            --url "$APP_URL" \
            --license "$APP_LICENSE" \
            --category "Utility" \
            --depends gtk3 \
            --depends libstdc++ \
            -C "$PACKAGE_ROOT" \
            -p "build/linux_amd64.rpm" \
            usr

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/linux_amd64.deb
            build/linux_amd64.rpm
            build/linux-x64.tar.gz

  build-and-release-ios:
    name: Build iOS
    runs-on: macos-26
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: ios
          rust-targets: aarch64-apple-ios

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign -v
          cd build/ios/iphoneos
          mkdir -p Payload
          ditto Runner.app Payload/Runner.app
          ditto -c -k --keepParent Payload ios-nosigned.ipa

      - name: Upload ios artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-ios
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            build/ios/iphoneos/ios-nosigned.ipa

  build-and-release-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-26
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            excluded-arch: x86_64
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            excluded-arch: arm64
            rust-target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up SDKs and caches
        uses: ./.github/actions/setup
        with:
          platform: macos-${{ matrix.arch }}
          rust-targets: ${{ matrix.rust-target }}

      - name: Select macOS architecture for all Xcode targets
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          EXCLUDED_ARCH: ${{ matrix.excluded-arch }}
        run: |
          # Xcode applies this override to Runner, Flutter, and plugin targets,
          # including the build-settings queries made by Flutter before building.
          CONFIG="$RUNNER_TEMP/booruflow-$TARGET_ARCH.xcconfig"
          printf 'ARCHS = %s\nEXCLUDED_ARCHS = %s\nONLY_ACTIVE_ARCH = NO\n' \
            "$TARGET_ARCH" "$EXCLUDED_ARCH" > "$CONFIG"
          echo "XCODE_XCCONFIG_FILE=$CONFIG" >> "$GITHUB_ENV"

      - name: Build and package macOS architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          flutter config --no-enable-macos-arm64-only
          flutter build macos --release -v
          APP=build/macos/Build/Products/Release/BooruFlow.app
          verify_architecture() {
            local binary="$1"
            lipo "$binary" -verify_arch "$TARGET_ARCH"
            test "$(lipo "$binary" -archs)" = "$TARGET_ARCH" || {
              echo "Expected only $TARGET_ARCH in $binary"
              exit 1
            }
          }
          verify_architecture "$APP/Contents/MacOS/BooruFlow"
          # Check every Mach-O library, including Flutter, plugins and Rust.
          while IFS= read -r -d '' library; do
            if file -b "$library" | grep -q 'Mach-O'; then
              verify_architecture "$library"
            fi
          done < <(find "$APP/Contents/Frameworks" -type f -print0)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "macos-$TARGET_ARCH-nosigned.zip"

      - name: Upload macos artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: macos-${{ matrix.arch }}-nosigned.zip

  publish:
    name: Publish complete release
    needs:
      - validate
      - build-and-release-android
      - build-and-release-windows-x64
      - build-and-release-linux-amd64
      - build-and-release-ios
      - build-and-release-macos
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish_release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify complete release assets
        run: |
          for asset in \
            app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
            app-universal-release.apk app-x86_64-release.apk \
            windows-x64.zip linux-x64.tar.gz linux_amd64.deb linux_amd64.rpm \
            ios-nosigned.ipa \
            macos-arm64-nosigned.zip macos-x86_64-nosigned.zip; do
            test -s "release/$asset" || {
              echo "Missing or empty release asset: $asset"
              exit 1
            }
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
