name: Flutter Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.7'
  RUST_VERSION: '1.96.0'

jobs:
  build-and-release-android:
    name: Build & Release APK
    runs-on: ubuntu-latest
    environment: apk-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/*.gradle.kts
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle/*.versions.toml

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Restore Keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE_BASE64" ]; then
            echo "KEYSTORE_FILE secret is empty or not available"
            exit 1
          fi

          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/booruflow-key.jks

          if [ ! -s android/app/booruflow-key.jks ]; then
            echo "Restored keystore is empty"
            exit 1
          fi

          ls -lh android/app/booruflow-key.jks

      - name: Verify Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/booruflow-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --android-project-arg=KEYSTORE_FILE=booruflow-key.jks \
            --android-project-arg=KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            --android-project-arg=KEY_ALIAS="$KEY_ALIAS" \
            --android-project-arg=KEY_PASSWORD="$KEY_PASSWORD"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
            build/app/outputs/apk/release/app-universal-release.apk
            build/app/outputs/apk/release/app-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-windows-x64:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows Build
        run: |
          cd build\windows\x64\runner\Release
          7z a -tzip windows-x64.zip .\*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/windows/x64/runner/Release/windows-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-linux-amd64:
    name: Build & Release Linux amd64
    runs-on: ubuntu-latest

    env:
      APP_NAME: booruflow
      APP_BINARY: booruflow
      APP_DISPLAY_NAME: BooruFlow
      APP_URL: https://github.com/normalllll/BooruFlow
      APP_LICENSE: GPL-3.0-only
      APP_ARCH: amd64
      RPM_ARCH: x86_64
      BUNDLE_DIR: build/linux/x64/release/bundle
      PACKAGE_ROOT: build/package-root
      DEB_DIR: build/deb/booruflow

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            dpkg-dev \
            rpm \
            ruby \
            ruby-dev \
            build-essential

          sudo gem install --no-document fpm

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Prepare Linux Package Root
        run: |
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Bundle directory not found: $BUNDLE_DIR"
            find build/linux -maxdepth 5 -type d || true
            exit 1
          fi

          if [ ! -f "icon-512.png" ]; then
            echo "icon-512.png not found in project root"
            exit 1
          fi

          rm -rf "$PACKAGE_ROOT" "$DEB_DIR"

          mkdir -p "$PACKAGE_ROOT/usr/lib/$APP_NAME"
          mkdir -p "$PACKAGE_ROOT/usr/bin"
          mkdir -p "$PACKAGE_ROOT/usr/share/applications"
          mkdir -p "$PACKAGE_ROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$PACKAGE_ROOT/usr/share/metainfo"

          cp -r "$BUNDLE_DIR/"* "$PACKAGE_ROOT/usr/lib/$APP_NAME/"

          cat > "$PACKAGE_ROOT/usr/bin/$APP_NAME" << EOF
          #!/usr/bin/env bash
          cd /usr/lib/$APP_NAME
          exec ./$APP_BINARY "\$@"
          EOF
          chmod +x "$PACKAGE_ROOT/usr/bin/$APP_NAME"

          cp -r linux/icons/hicolor/. "$PACKAGE_ROOT/usr/share/icons/hicolor/"

          cat > "$PACKAGE_ROOT/usr/share/applications/$APP_NAME.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=$APP_DISPLAY_NAME
          Comment=$APP_DISPLAY_NAME
          Exec=$APP_NAME
          Icon=$APP_NAME
          Terminal=false
          Categories=Utility;
          StartupNotify=true
          EOF

          cat > "$PACKAGE_ROOT/usr/share/metainfo/$APP_NAME.metainfo.xml" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$APP_NAME</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>$APP_LICENSE</project_license>
            <name>$APP_DISPLAY_NAME</name>
            <summary>$APP_DISPLAY_NAME desktop application</summary>
            <description>
              <p>$APP_DISPLAY_NAME desktop application built with Flutter.</p>
            </description>
            <launchable type="desktop-id">$APP_NAME.desktop</launchable>
            <url type="homepage">$APP_URL</url>
            <provides>
              <binary>$APP_NAME</binary>
            </provides>
          </component>
          EOF

      - name: Package Linux Tarball
        run: |
          tar -C "$BUNDLE_DIR" -czvf "build/linux-amd64.tar.gz" .

      - name: Package Linux Deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p "$DEB_DIR/DEBIAN"
          cp -r "$PACKAGE_ROOT/"* "$DEB_DIR/"

          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: $APP_NAME
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $APP_ARCH
          Maintainer: normalllll
          Homepage: $APP_URL
          Depends: libgtk-3-0, libstdc++6
          Description: $APP_DISPLAY_NAME desktop application
           $APP_DISPLAY_NAME desktop application built with Flutter.
          EOF

          dpkg-deb --build --root-owner-group "$DEB_DIR" "build/linux_amd64.deb"

      - name: Package Linux RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          fpm \
            -s dir \
            -t rpm \
            -n "$APP_NAME" \
            -v "$VERSION" \
            --architecture "$RPM_ARCH" \
            --description "$APP_DISPLAY_NAME desktop application built with Flutter." \
            --url "$APP_URL" \
            --license "$APP_LICENSE" \
            --category "Utility" \
            --depends gtk3 \
            --depends libstdc++ \
            -C "$PACKAGE_ROOT" \
            -p "build/linux_amd64.rpm" \
            usr

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/linux_amd64.deb
            build/linux_amd64.rpm
            build/linux-amd64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-ios:
    name: Build & Release iOS
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign -v
          cd build/ios/iphoneos
          mkdir Payload
          mv ./Runner.app ./Payload
          zip -r -m ./ios-nosigned.ipa ./Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/ios/iphoneos/ios-nosigned.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-macos:
    name: Build & Release macOS arm64 & x86_64
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: true
          cache-workspaces: rust -> rust/target
          cache-key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build macOS arm64
        run: |
          export FLUTTER_BUILD_ARCH=arm64
          flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/BooruFlow.app macos-arm64-nosigned.zip

      - name: Build macOS x86_64
        run: |
          export FLUTTER_BUILD_ARCH=x86_64
          flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/BooruFlow.app macos-x86_64-nosigned.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            macos-arm64-nosigned.zip
            macos-x86_64-nosigned.zip
          token: ${{ secrets.GITHUB_TOKEN }}
