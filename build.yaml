targets:
  $default:
    builders:
      freezed:
        options:
          format: true
      # Use Slang's supported legacy writer with build_runner 2.16.
      # Keep the same options visible to the Slang CLI audit commands.
      slang_build_runner:
        enabled: false
        options: &slang_options
          base_locale: en
          input_directory: lib/intl
          input_file_pattern: .i18n.yaml
          output_directory: lib/intl
          output_file_name: translations.g.dart
          fallback_strategy: base_locale
          lazy: false
          format:
            enabled: true
            width: 80
      slang_build_runner:legacy:
        enabled: true
        options: *slang_options
