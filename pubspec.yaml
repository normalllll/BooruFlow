name: booruflow
description: "A cross-platform browser for multiple booru image sources"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.13.2+42

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # frost_ui brings its native window plugin (frost_window) from the same checkout.
  frost_ui:
    git:
      url: &frost https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: &frost_ref dd0fa30eae16a45df7228ed529ecb7dd19db1f36
  frost_data:
    git: {url: *frost, path: packages/frost_data, ref: *frost_ref}
  flutter_media_cache:
    git:
      url: https://github.com/normalllll/flutter_media_cache.git
      ref: fd058fbdbc91368e6477df795c596957e95a209f
  pasteboard: ^0.6.2
  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2
  code_assets: ^2.2.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  path_provider: ^2.1.6
  path: ^1.9.1
  go_router: ^18.1.4
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  file_picker: ^13.4.1
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  drift: ^2.35.4
  crypto: ^3.0.8
  freezed_annotation: ^3.1.0

  intl: ^0.20.3
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7

# media_kit's macOS and iOS library packages, fetching the reduced libmpv of
# tool/libmpv. A local pubspec_overrides.yaml replaces this whole section and
# must repeat both entries.
dependency_overrides:
  media_kit_libs_macos_video:
    path: third_party/media_kit_libs_macos_video
  media_kit_libs_ios_video:
    path: third_party/media_kit_libs_ios_video

dev_dependencies:
  flutter_driver:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.10
  slang_build_runner: ^4.19.0
  drift_dev: ^2.35.3
  freezed: ^4.0.3

flutter:
  uses-material-design: false

  assets:
    - assets/tag_translations/
    - assets/images/freepiv-icon.png
    - assets/images/app-icon.png

    - assets/fonts/LICENSE-Lucide.txt

    # CJK subsets for the platforms without good system CJK fonts; they are
    # registered at startup by lib/app/bundled_fonts.dart.
    - path: assets/fonts/NotoSansSC-Subset.ttf
      platforms: [windows, linux]
    - path: assets/fonts/NotoSansJP-Subset.ttf
      platforms: [windows, linux]
    - path: assets/fonts/OFL-NotoSansCJK.txt
      platforms: [windows, linux]
  fonts:
    - family: BooruFlowIcons
      fonts:
        - asset: assets/fonts/BooruFlowIcons.ttf
