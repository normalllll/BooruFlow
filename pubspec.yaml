name: booruflow
description: "A cross-platform browser for multiple booru image sources"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.12.0+39

environment:
  sdk: ^3.12.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # frost_ui brings its native window plugin from the same Git revision.
  frost_ui:
    git:
      url: https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: v0.2.0
  pasteboard: ^0.5.0
  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2
  code_assets: ^2.1.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0

  meta: ^1.19.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  path_provider: ^2.1.6
  path: ^1.9.1
  extended_image: ^10.1.0
  go_router: ^18.0.2
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  file_picker: ^13.1.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  drift: ^2.35.2
  sqlite3: ^3.7.0
  crypto: ^3.0.7
  freezed_annotation: ^3.1.0

  intl: ^0.20.3
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  slang_build_runner: ^4.19.0
  drift_dev: ^2.35.1
  sqlparser: ^0.45.0
  freezed: ^4.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/tag_translations/
    - assets/images/freepiv-icon.png
    - assets/images/app-icon.png

    - assets/fonts/OFL-NotoSansCJK.txt
    - assets/fonts/LICENSE-Lucide.txt
  fonts:
    - family: BooruFlowIcons
      fonts:
        - asset: assets/fonts/BooruFlowIcons.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Subset.ttf
