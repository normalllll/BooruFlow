name: booruflow
description: "A cross-platform browser for multiple booru image sources"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.10.0+37

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  meta:
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  path_provider: ^2.1.6
  visibility_detector: ^0.4.0+2
  path: ^1.9.1
  loading_more_list: ^7.1.0
  pull_to_refresh_notification: ^3.1.1
  extended_image: ^10.1.0
  toastification: ^3.2.0
  go_router: ^18.0.1
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  flutter_animate: ^4.5.2
  file_picker: ^12.0.0-beta.5
  skeletonizer: ^2.1.3
  slang: ^4.16.0
  slang_flutter: ^4.16.0
  drift: ^2.34.0
  sqlite3: ^3.3.3
  crypto: ^3.0.7
  freezed_annotation: ^3.1.0

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  slang_build_runner: ^4.16.0
  drift_dev: ^2.34.0
  sqlparser: 0.44.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/tag_translations/
    - assets/images/freepiv-icon.png
    - assets/branding/app_icon_source.png
