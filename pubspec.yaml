name: booruflow
description: "A cross-platform browser for multiple booru image sources"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.13.1+41

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # frost_ui brings its native window plugin (frost_window) from the same checkout.
  frost_ui:
    git:
      url: &frost https://github.com/normalllll/frost_ui.git
      path: packages/frost_ui
      ref: &frost_ref 04b065210cca9497f740e3c805aa3e1b9af47587
  frost_data:
    git: {url: *frost, path: packages/frost_data, ref: *frost_ref}
  flutter_media_cache:
    git:
      url: https://github.com/normalllll/flutter_media_cache.git
      ref: c55f7afaf96684b5c5d35fb12225c6443e83c0e4
  pasteboard: ^0.6.0
  flutter_rust_bridge: 2.14.0-beta.2
  flutter_rust_bridge_hooks: 2.14.0-beta.2
  code_assets: ^2.2.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  path_provider: ^2.1.6
  path: ^1.9.1
  go_router: ^18.1.4
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  file_picker: ^13.3.3
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  drift: ^2.35.4
  crypto: ^3.0.8
  freezed_annotation: ^3.1.0

  intl: ^0.20.3
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dev_dependencies:
  flutter_driver:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.10
  slang_build_runner: ^4.19.0
  drift_dev: ^2.35.3
  freezed: ^4.0.3

flutter:
  uses-material-design: false

  assets:
    - assets/tag_translations/
    - assets/images/freepiv-icon.png
    - assets/images/app-icon.png

    - assets/fonts/OFL-NotoSansCJK.txt
    - assets/fonts/LICENSE-Lucide.txt
  fonts:
    - family: BooruFlowIcons
      fonts:
        - asset: assets/fonts/BooruFlowIcons.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Subset.ttf
